[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-minutes-service"
version = "0.1.0"
description = "Self-hosted service that turns meeting audio into structured Chinese meeting minutes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "httpx>=0.27,<1.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "pydantic-settings>=2.3,<3.0",
    "python-multipart>=0.0.9",
    "cryptography>=42,<46",
    "websockets>=12,<17",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "hypothesis>=6.100,<7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
