# Reverse-proxy Nginx config (task 14.2). Single public entrypoint for the
# stack: routes /api/* to the Backend_API and everything else to the
# Web_Frontend SPA. Enforces a request-body cap at least as large as the
# Backend_API's configured maximum upload size.
#
# WebSocket support (realtime-meeting-transcription): the live Streaming_Connection
# at WS /api/meetings/{id}/live needs the Upgrade/Connection headers forwarded.
# This `map` (http scope -- valid here because conf.d files are included inside
# http{}) yields "upgrade" only for an actual WebSocket request and "close"
# otherwise, so ordinary /api/* REST calls are unaffected.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit zone for the login endpoint, to blunt password brute-forcing
# (Req: defense-in-depth). One shared 10 MB zone keyed by client IP tracks
# ~160k source addresses; 10 requests/minute is generous for a human login yet
# caps automated guessing. Nginx is the edge here (it publishes :80), so
# $binary_remote_addr is the real client IP, not an internal proxy hop.
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Must be >= Backend_API MAX_UPLOAD_BYTES (default 500 MB) so an at-limit
    # upload reaches the API (which applies the precise per-Req-3.3 413), while
    # a truly oversized body is rejected here with 413 (Req 12.5 / 12.6).
    client_max_body_size 512m;

    # Security response headers (defense-in-depth). `always` so they are sent on
    # error responses too (401/413/429). These are set at the server scope and
    # inherited by every location below, since none of them declare their own
    # add_header (an add_header in a location would otherwise drop these).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Content-Security-Policy: same-origin by default. `script-src 'self'` plus
    # the sha256 of the inline "no-flash theme" bootstrap in the SPA's
    # index.html -- UPDATE this hash if that inline <script> ever changes, or
    # the page will be blocked. `style-src` permits inline styles the SPA sets
    # at runtime; `connect-src 'self'` also governs the live WebSocket
    # (ws(s):// to the same origin). `frame-ancestors 'none'` mirrors
    # X-Frame-Options for modern browsers; `object-src 'none'` blocks plugins.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-vHHVmK2jNlxs6VNs3VcQAFoCqvBdb22Z2fEHLj22QI8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Brute-force protection: rate-limit the login endpoint specifically. This
    # EXACT-match location takes precedence over the /api/ prefix below, so only
    # POST /api/auth/login is throttled (all other /api/* traffic is untouched).
    # `burst=5 nodelay` absorbs a few quick legitimate retries; sustained
    # guessing beyond the zone's 10r/m is rejected with 429. `proxy_pass`
    # without a URI preserves the /api/auth/login path to the API.
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/* -> Backend_API. No trailing slash on proxy_pass so the /api prefix
    # is PRESERVED (the API mounts its routes under /api). Upload bodies are
    # streamed straight through rather than buffered to disk first.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade for the live Streaming_Connection.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        # Raised well above live_inactivity_timeout_seconds (default 300s) so
        # Nginx never severs an otherwise-active live socket before the API's
        # own inactivity logic runs.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else -> the Web_Frontend SPA container (which itself serves the
    # static bundle with an index.html fallback for client-side routes).
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
