# SPA static-serving config for the Web_Frontend container. Serves the built
# Vite bundle and falls back to index.html so client-side (React Router) routes
# like /meetings/:id resolve on a full-page load / refresh.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed, content-addressed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: any unmatched path serves the SPA entrypoint.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
