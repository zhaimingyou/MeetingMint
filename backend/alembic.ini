# Alembic configuration for the meeting-minutes-service backend.
#
# The database URL is intentionally NOT hardcoded here. `migrations/env.py`
# resolves it at runtime (see that file for the precedence rules):
#   1. the `sqlalchemy.url` main option, if set programmatically
#      (app.migrations_runner does this), or
#   2. the ALEMBIC_DATABASE_URL environment variable (handy for ad-hoc
#      `alembic upgrade head` against a throwaway SQLite file), or
#   3. app.config.get_settings().database_url (the runtime default).
#
# `script_location` is given relative to this file's directory so the CLI works
# from the backend project root. app.migrations_runner overrides it with an
# absolute path so it also resolves from the repo root and inside the container.

[alembic]
script_location = migrations
prepend_sys_path = .
# Split path options (prepend_sys_path / version_locations) on the OS path
# separator. `version_path_separator` is the older spelling; `path_separator`
# is the current one (Alembic >= 1.13) -- set both for forward/back compat.
path_separator = os
version_path_separator = os

# Leave blank on purpose; env.py supplies the URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
